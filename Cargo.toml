[package]
name = "libflatterer"
version = "0.24.0"
authors = ["David Raznick <kindly@gmail.com>"]
edition = "2024"
description = "Lib to make JSON flatterer"
license = "MIT"
repository = "https://github.com/kindly/libflatterer"
homepage = "https://github.com/kindly/libflatterer"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yajlish = { version = "0.4.0" }
#yajlish = { path = "../yajlish" }
serde_json = { version = "1", features = ["preserve_order"] }
itertools = "0.14.0"
csv = "1"
serde = { version = "1", features = ["derive"] }
smallvec = "1.15.1"
regex = "1"
slug = "0.1"
smartstring = { version = "1.0.1", features = ["serde"] }
snafu = { version = "0.9.1" }
indexmap = { version = "2.14.0", features = ["serde"] }
log = "0.4"
lazy_static = "1"
typed-builder = "0.23.2"
num_cpus = "1.17.0"
flate2 = "1.1.9"
csvs_convert = { version = "0.13.1", default-features = false, features = ["converters"] }
bytes = "1.11.1"
url = "2.5.8"
jsonpath-rust = "1.0.4"

[target.'cfg(target_family = "wasm")'.dependencies]
# getrandom = {version="0.2", features = ["js"]}
umya-spreadsheet = "2.3.3"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
jsonref = "0.4"
object_store = { version = "0.13.2", features = ["aws", "http"] }
#object_store = { git = "https://github.com/apache/arrow-rs.git", features = ["aws", "http"]}

rust_xlsxwriter = { version = "0.95.0", features = ["constant_memory"] }
crossbeam-channel = "0.5"
tempfile = "3"
nanoid = "0.5.0"
tokio = { version = "1.52.3", features = ["rt"] }
csv-async = { version = "1.3.1", features = ["tokio"] }
futures-util = { version = "0.3.32" }
parquet = { version = "58.3.0", features = ["async"] }
tokio-util = { version = "0.7.18", features = ["io", "io-util"] }
futures = { version = "0.3.32" }
arrow-array = "58.3.0"
arrow-schema = "58.3.0"
async-compression = { version = "0.4.42", features = ["gzip", "tokio"] }
env_logger = "0.11.10"

[dev-dependencies]
insta = { version = "1.47.2", features = ["redactions", "yaml"] }
logtest = "2.0.0"

[profile.release]
debug = 1

[features]
default = ["parquet"]
parquet = ["csvs_convert/parquet"]

[package.metadata.docs.rs]
no-default-features = true
